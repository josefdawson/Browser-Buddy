<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo & Document Attachment Challenge — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Photo & Document Attachment Challenge 📎</h1>
    <p class="muted">Attach the right file — and check before sending.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="ac-score">0</div><div class="l">Correct</div></div>
      <div class="game-stat"><div class="n" id="ac-round">1 / 5</div><div class="l">Task</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="ac-instr"></p>
      <div id="ac-compose" style="background:#f7f9fd;border:2px solid var(--line);border-radius:12px;padding:12px">
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn btn-ghost" id="ac-attach">📎 Attach</button>
          <button class="btn btn-ghost" id="ac-gallery">🖼️ Gallery</button>
          <button class="btn btn-primary" id="ac-send" style="margin-left:auto">Send</button>
        </div>
        <div id="ac-attachments" style="min-height:40px;padding:8px;background:#fff;border-radius:8px"></div>
      </div>
      <div id="ac-picker" style="display:none;margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px">
        <p style="font-weight:600;margin:0 0 8px">Pick files:</p>
        <div id="ac-files"></div>
      </div>
    </div>
    <div class="game-over" id="ac-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="update-log.js"></script>
<script src="hooks.js"></script>
<script src="content-drip.js"></script>
<script src="feedback.js"></script>
  <script src="attachment-challenge.js"></script>
</body>
</html>
