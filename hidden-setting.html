<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Hidden Setting — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Find the Hidden Setting 🕵️</h1>
    <p class="muted">Navigate the settings menu to find the right option. Fewer clicks = more stars.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="hs-score">0</div><div class="l">Stars</div></div>
      <div class="game-stat"><div class="n" id="hs-round">1 / 6</div><div class="l">Goal</div></div>
      <div class="game-stat"><div class="n" id="hs-clicks">0</div><div class="l">Clicks</div></div>
    </div>
    <div class="sh-goal" id="hs-goal"></div>
    <div class="sh-settings" id="hs-settings"></div>
    <div class="game-over" id="hs-over" style="display:none"></div>
  </main>
  <script src="app.js"></script>\n  <script src="sound.js"></script>
  <script src="hidden-setting.js"></script>
</body>
</html>
