<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Chaos Organizer — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Tab Chaos Organizer 🗂️</h1>
    <p class="muted">12 messy tabs. Complete the missions: mute the noisy tab, pin the email tab, reopen a closed tab.</p>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice">Practice (no timer)</button>
      <button class="mode-btn" data-mode="challenge">Challenge (timed)</button>
    </div>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="tc-score">0</div><div class="l">Missions done</div></div>
      <div class="game-stat"><div class="n" id="tc-round">1 / 6</div><div class="l">Mission</div></div>
      <div class="game-stat timer" id="tc-timer" style="display:none"><div class="n" id="tc-time">45</div><div class="l">Seconds</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="tc-instr"></p>
      <div class="tc-tabs" id="tc-tabs"></div>
    </div>
    <div class="game-actions">
      <button class="btn btn-primary btn-big" id="tc-start">Start game</button>
    </div>
    <div class="game-over" id="tc-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="sound.js"></script>
<script src="update-log.js"></script>
<script src="presence.js"></script>
  <script src="tab-chaos.js"></script>
</body>
</html>
