<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle">
        <input type="checkbox" id="jargon-toggle">
        <span>Use everyday words</span>
      </label>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>

  <main class="soon-wrap">
    <div class="soon-card">
      <span class="module-icon" id="soon-icon">🚧</span>
      <h1 id="soon-title">Coming soon</h1>
      <p id="soon-desc">This module is still being built.</p>
      <a class="btn btn-primary" href="index.html">← Back to Browser Buddy</a>
    </div>
  </main>

  <script src="app.js"></script>\n  <script src="sound.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get("m") || "";
    const modules = {
      dictionary: {
        icon: "🔣",
        title: "Icon Dictionary",
        desc: "An interactive encyclopedia of common icons — the three dots, the hamburger menu, the share arrow, and more — plus flashcards and quizzes.",
      },
      builder: {
        icon: "🧩",
        title: "Click-Through Builder",
        desc: "Make your own step-by-step lessons from screenshots. Draw hotspots, add plain-English captions, and share a link with family.",
      },
      trainer: {
        icon: "🌐",
        title: "Browser & Tab Survival Trainer",
        desc: "A browser-inside-a-browser that teaches tabs, pop-ups, downloads, and permissions — safely.",
      },
      scam: {
        icon: "🕵️",
        title: "Scam or Safe?",
        desc: "A game that trains you to spot tricky download buttons, fake cookie banners, and suspicious permission pop-ups.",
      },
    };
    const info = modules[key] || { icon: "🚧", title: "Coming soon", desc: "This module is still being built." };
    document.getElementById("soon-icon").textContent = info.icon;
    document.getElementById("soon-title").textContent = info.title;
    document.getElementById("soon-desc").textContent = info.desc;
  </script>
</body>
</html>
