<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Did My Download Go? — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Where Did My Download Go? 📥</h1>
    <p class="muted">Download a file, then find it in the browser's downloads list before the event starts.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="wd-score">0</div><div class="l">Found</div></div>
      <div class="game-stat"><div class="n" id="wd-round">1 / 5</div><div class="l">Round</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="wd-instr"></p>
      <div id="wd-browser" class="app-window" style="min-height:260px;margin-top:12px">
        <div class="app-window-titlebar">
          <span class="dots"><span></span><span></span><span></span></span>
          <span>Practice Browser</span>
          <span style="margin-left:auto;cursor:pointer" id="wd-dlbtn" title="Downloads">⬇️</span>
        </div>
        <div class="wd-content" id="wd-content"></div>
        <div class="wd-dlpanel" id="wd-dlpanel" style="display:none"></div>
      </div>
    </div>
    <div class="game-over" id="wd-over" style="display:none"></div>
  </main>
  <script src="app.js"></script>
  <script src="where-download.js"></script>
</body>
</html>
