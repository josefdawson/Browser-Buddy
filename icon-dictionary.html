<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Dictionary — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
  <link rel="stylesheet" href="icon-dictionary.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle">
        <input type="checkbox" id="jargon-toggle">
        <span>Use everyday words</span>
      </label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>

  <main class="id-wrap">
    <h1>Icon Dictionary 🔣</h1>
    <p class="muted">What does that little picture mean? Browse, study with flashcards, or take a quiz.</p>

    <nav class="id-tabs">
      <button class="id-tab active" data-tab="browse">📖 Browse</button>
      <button class="id-tab" data-tab="flashcards">🃏 Flashcards</button>
      <button class="id-tab" data-tab="quiz">❓ Quiz</button>
    </nav>

    <!-- Browse -->
    <section class="id-pane active" id="pane-browse">
      <div class="id-filters">
        <button class="id-filter active" data-cat="all">All</button>
        <button class="id-filter" data-cat="browser">🌐 Browser</button>
        <button class="id-filter" data-cat="email">📧 Email</button>
        <button class="id-filter" data-cat="video">📹 Video calls</button>
        <button class="id-filter" data-cat="settings">⚙️ Settings</button>
        <button class="id-filter" data-cat="safety">🛡️ Safety</button>
      </div>
      <input type="search" id="id-search" placeholder="Search icons..." class="id-search">
      <div class="id-grid" id="id-grid"></div>
    </section>

    <!-- Flashcards -->
    <section class="id-pane" id="pane-flashcards">
      <div class="id-card" id="id-flashcard">
        <div class="id-card-glyph" id="fc-glyph">?</div>
        <div class="id-card-name" id="fc-name" style="display:none"></div>
        <div class="id-card-desc" id="fc-desc" style="display:none"></div>
      </div>
      <div class="id-actions">
        <button class="btn btn-ghost" id="fc-show">Show answer</button>
        <button class="btn btn-primary" id="fc-next">Next card →</button>
      </div>
      <p class="muted" id="fc-progress"></p>
    </section>

    <!-- Quiz -->
    <section class="id-pane" id="pane-quiz">
      <div class="id-quiz-card">
        <div class="id-quiz-glyph" id="qz-glyph">?</div>
        <p class="id-quiz-q" id="qz-question"></p>
        <div class="id-quiz-options" id="qz-options"></div>
        <div class="id-quiz-feedback" id="qz-feedback"></div>
        <div class="id-actions">
          <button class="btn btn-primary" id="qz-next" style="display:none">Next question →</button>
        </div>
      </div>
      <p class="muted" id="qz-score"></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="sound.js"></script>
<script src="update-log.js"></script>
<script src="hooks.js"></script>
<script src="content-drip.js"></script>
<script src="feedback.js"></script>
<script src="presence.js"></script>
  <script src="icon-dictionary.js"></script>
</body>
</html>
