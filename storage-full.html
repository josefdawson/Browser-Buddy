<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Full! Clean-Up — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Storage Full! Clean-Up 💾</h1>
    <p class="muted">Free up space to download an important file.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="sf-storage">95%</div><div class="l">Storage used</div></div>
      <div class="game-stat"><div class="n" id="sf-freed">0 MB</div><div class="l">Freed</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="sf-instr">You need 500 MB free to download an important file. Clear space.</p>
      <div id="sf-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="game-over" id="sf-over" style="display:none"></div>
  </main>
  <script src="app.js"></script>
  <script src="storage-full.js"></script>
</body>
</html>
