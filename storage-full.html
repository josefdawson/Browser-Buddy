  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>

      <div class="game-stat"><div class="n" id="sf-freed">0 MB</div><div class="l">Freed</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="sf-instr">You need 500 MB free to download an important file. Clear space.</p>
      <div id="sf-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="game-over" id="sf-over" style="display:none"></div>
