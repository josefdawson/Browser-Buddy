<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Explorer Rescue — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>File Explorer Rescue 📁</h1>
    <p class="muted">Find, rename, and move files in a messy folder system.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="fe-score">0</div><div class="l">Done</div></div>
      <div class="game-stat"><div class="n" id="fe-round">1 / 4</div><div class="l">Task</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="fe-instr"></p>
      <div id="fe-path" style="color:var(--muted);font-size:.85rem;margin-bottom:8px"></div>
      <div id="fe-list" style="background:#f7f9fd;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:120px"></div>
      <div class="game-actions" style="margin-top:10px">
        <button class="btn btn-ghost" id="fe-back">← Back</button>
        <button class="btn btn-ghost" id="fe-rename">Rename selected</button>
        <button class="btn btn-ghost" id="fe-move">Move selected</button>
        <button class="btn btn-ghost" id="fe-trash">Trash selected</button>
      </div>
    </div>
    <div class="game-over" id="fe-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="update-log.js"></script>
<script src="feedback.js"></script>
  <script src="file-explorer.js"></script>
</body>
</html>
