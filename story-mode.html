<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Mode — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <style>
    .sm-stage { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 24px; min-height: 420px; }
    .sm-char { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .sm-avatar { font-size: 2.4rem; }
    .sm-name { font-weight: 700; font-size: 1.1rem; }
    .sm-dialogue { background: #f2f6ff; border-left: 4px solid var(--primary); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; font-size: 1.05rem; }
    .sm-scene { background: #f7f9fd; border: 2px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-height: 160px; }
    .sm-progress { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
    .sm-lesson { background: #f2f6ff; border: 1px solid #d3defa; border-radius: 10px; padding: 12px 14px; font-size: .9rem; margin-top: 10px; }
    .sm-hint { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: 8px; }
    .sm-ui { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
    .sm-ui button { margin: 4px; }
    .sm-ui input, .sm-ui select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; font-family: inherit; margin: 4px; }
    .sm-ui .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Story Mode 📖</h1>
    <p class="muted">Help a friend through a real task. Do the actions yourself to show them how.</p>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice">Practice (with hints)</button>
      <button class="mode-btn" data-mode="challenge">Challenge (no hints)</button>
    </div>

    <div class="game-hud">
      <div class="game-stat"><div class="n" id="sm-score">0</div><div class="l">Stories done</div></div>
      <div class="game-stat"><div class="n" id="sm-round">1 / 5</div><div class="l">Story</div></div>
    </div>

    <div class="sm-stage" id="sm-stage">
      <div class="sm-char">
        <span class="sm-avatar" id="sm-avatar">👵</span>
        <span class="sm-name" id="sm-name"></span>
      </div>
      <div class="sm-progress" id="sm-progress"></div>
      <div class="sm-dialogue" id="sm-dialogue"></div>
      <div class="sm-scene" id="sm-scene"></div>
      <div class="sm-hint" id="sm-hint"></div>
      <div class="sm-lesson" id="sm-lesson" style="display:none"></div>
    </div>

    <div class="game-over" id="sm-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
  <script src="sound.js"></script>
<script src="update-log.js"></script>
<script src="presence.js"></script>
  <script src="story-mode.js"></script>
</body>
</html>
