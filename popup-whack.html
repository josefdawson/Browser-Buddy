  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop-Up Whack-a-Mole — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">

<body>

  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>

  <main class="scam-wrap">
    <h1>Pop-Up Whack-a-Mole 🎯</h1>
    <p class="muted">Pop-ups flood the screen. Click the real tiny × buttons. Avoid the fake "Close" buttons that spawn more pop-ups!</p>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice">Practice (no timer)</button>
      <button class="mode-btn" data-mode="challenge">Challenge (timed)</button>
    </div>

    <div class="game-hud">
      <div class="game-stat"><div class="n" id="pw-score">0</div><div class="l">Closed</div></div>
      <div class="game-stat"><div class="n" id="pw-missed">0</div><div class="l">Missed</div></div>
      <div class="game-stat"><div class="n" id="pw-traps">0</div><div class="l">Traps hit</div></div>
      <div class="game-stat timer" id="pw-timer" style="display:none"><div class="n" id="pw-time">30</div><div class="l">Seconds</div></div>
    </div>

    <div class="pw-stage" id="pw-stage"></div>

    <div class="game-actions">
      <button class="btn btn-primary btn-big" id="pw-start">Start game</button>
    </div>

    <div class="game-over" id="pw-over" style="display:none"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
