<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Survival Trainer — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
  <link rel="stylesheet" href="browser-trainer.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle">
        <input type="checkbox" id="jargon-toggle">
        <span>Use everyday words</span>
      </label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>

  <main class="bt-wrap">
    <h1>Browser Survival Trainer 🌐</h1>
    <p class="muted">Real browser situations — tabs, pop-ups, downloads, and permissions. Practice safely.</p>

    <div class="bt-hud">
      <div class="scam-stat"><div class="n" id="bt-score">0</div><div class="l">Passed</div></div>
      <div class="scam-stat"><div class="n" id="bt-streak">0</div><div class="l">Streak</div></div>
      <div class="scam-stat"><div class="n" id="bt-round">1 / 8</div><div class="l">Scenario</div></div>
    </div>

    <div class="bt-layout">
      <aside class="bt-side">
        <div class="mission-panel">
          <div class="mission-tag">Scenario</div>
          <h2 id="bt-title"></h2>
          <p class="mission-plain" id="bt-instr"></p>
          <div class="tip-box" id="bt-tip"></div>
          <div class="mission-actions" style="margin-top:14px">
            <button class="btn btn-primary btn-big" id="bt-next" style="display:none">Next scenario →</button>
          </div>
        </div>
        <div class="mission-panel" id="bt-feedback" style="display:none"></div>
      </aside>

      <section class="bt-browser">
        <div class="app-window">
          <div class="app-window-titlebar">
            <span class="dots"><span></span><span></span><span></span></span>
            <span id="bt-app-title">Practice Browser</span>
            <span class="titlebar-note">Pretend browser</span>
          </div>
          <div class="bt-chrome">
            <div class="browser-tabbar" id="bt-tabs"></div>
            <div class="browser-navbar">
              <button class="nav-btn" data-bt="back" title="Back">←</button>
              <button class="nav-btn" data-bt="forward" title="Forward">→</button>
              <button class="nav-btn" data-bt="reload" title="Reload">↻</button>
              <input type="text" id="bt-address" placeholder="Type a web address" aria-label="Address bar">
              <button class="nav-btn go" data-bt="go">Go</button>
              <button class="nav-btn star" data-bt="bookmark" title="Bookmark">☆</button>
              <span class="zoom-group">
                <button class="nav-btn" data-bt="zoom-out">A−</button>
                <span id="bt-zoom">100%</span>
                <button class="nav-btn" data-bt="zoom-in">A＋</button>
              </span>
            </div>
          </div>
          <div class="bt-content" id="bt-content"></div>
        </div>
      </section>
    </div>

    <div class="bt-over" id="bt-over" style="display:none"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="sound.js"></script>
<script src="update-log.js"></script>
<script src="hooks.js"></script>
<script src="content-drip.js"></script>
<script src="feedback.js"></script>
<script src="presence.js"></script>
  <script src="browser-trainer.js"></script>
</body>
</html>
