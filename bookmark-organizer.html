<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Organizer — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Bookmark Organizer 📑</h1>
    <p class="muted">Sort messy bookmarks into folders. Star new favorites. Toggle the bookmarks bar.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="bo-score">0</div><div class="l">Sorted</div></div>
      <div class="game-stat"><div class="n" id="bo-round">1 / 5</div><div class="l">Task</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="bo-instr"></p>
      <div id="bo-bar" style="background:#eef1f8;padding:8px;border-radius:8px;margin-bottom:10px;display:none">
        <strong>Bookmarks bar:</strong> <span id="bo-baritems"></span>
      </div>
      <div id="bo-area"></div>
      <div class="game-actions" style="margin-top:12px">
        <button class="btn btn-ghost" id="bo-togglebar">Toggle bookmarks bar (Ctrl+Shift+B)</button>
      </div>
    </div>
    <div class="game-over" id="bo-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="update-log.js"></script>
<script src="feedback.js"></script>
  <script src="bookmark-organizer.js"></script>
</body>
</html>
