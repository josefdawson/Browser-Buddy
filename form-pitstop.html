<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form & Password Pitstop — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Form & Password Pitstop 📝</h1>
    <p class="muted">Fill out the form correctly — toggle the eye to check your password, pick from dropdowns, check the right boxes.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="fp-time">60</div><div class="l">Seconds</div></div>
      <div class="game-stat"><div class="n" id="fp-score">0</div><div class="l">Score</div></div>
    </div>
    <div class="fp-form" id="fp-form">
      <label>Full name</label>
      <input type="text" id="fp-name" placeholder="Jane Doe">

      <label>Password (must be at least 8 chars)</label>
      <div class="pw-wrap">
        <input type="password" id="fp-pw" placeholder="••••••••">
        <button class="pw-toggle" id="fp-pwtoggle" title="Show/hide password">👁️</button>
      </div>

      <label>Country</label>
      <select id="fp-country">
        <option value="">-- Select --</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
      </select>

      <label>Birth year</label>
      <select id="fp-year">
        <option value="">-- Select --</option>
        <option value="1990">1990</option>
        <option value="1985">1985</option>
        <option value="1975">1975</option>
      </select>

      <div class="checkbox-row">
        <input type="checkbox" id="fp-terms">
        <label for="fp-terms" style="margin:0">I agree to the terms</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="fp-news">
        <label for="fp-news" style="margin:0">Send me newsletters (optional)</label>
      </div>

      <div class="checkbox-row">
        <input type="radio" name="contact" id="fp-email" value="email">
        <label for="fp-email" style="margin:0">Contact by email</label>
      </div>
      <div class="checkbox-row">
        <input type="radio" name="contact" id="fp-phone" value="phone">
        <label for="fp-phone" style="margin:0">Contact by phone</label>
      </div>

      <div class="game-actions" style="margin-top:14px">
        <button class="btn btn-primary btn-big" id="fp-submit">Submit</button>
      </div>
    </div>
    <div class="game-over" id="fp-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="sound.js"></script>
<script src="update-log.js"></script>
<script src="presence.js"></script>
  <script src="form-pitstop.js"></script>
</body>
</html>
