<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <a class="settings-link" href="account.html">Account</a>
      <a class="settings-link" href="settings.html">?? Settings</a>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Permission Police 🛡️</h1>
    <p class="muted">An app asks for a permission. Allow or Block based on whether it actually needs it.</p>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="practice">Practice (no timer)</button>
      <button class="mode-btn" data-mode="challenge">Challenge (timed)</button>
    </div>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="pp-score">0</div><div class="l">Correct</div></div>
      <div class="game-stat"><div class="n" id="pp-round">1 / 8</div><div class="l">Round</div></div>
      <div class="game-stat timer" id="pp-timer" style="display:none"><div class="n" id="pp-time">10</div><div class="l">Seconds</div></div>
    </div>
    <div class="game-card">
      <div class="pp-card" id="pp-card"></div>
      <div class="id-quiz-feedback" id="pp-feedback"></div>
    </div>
    <div class="game-over" id="pp-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
