<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store Safety Check — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>App Store Safety Check 📱</h1>
    <p class="muted">Spot the real app among lookalike clones. Check developer, rating, downloads, and sponsored tags.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="as-score">0</div><div class="l">Correct</div></div>
      <div class="game-stat"><div class="n" id="as-round">1 / 5</div><div class="l">Round</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="as-instr"></p>
      <div id="as-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="game-over" id="as-over" style="display:none"></div>
  </main>
  <script src="app.js"></script>
  <script src="app-store.js"></script>
</body>
</html>
