<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NXK54PF5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Sheet Master — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="update-log.css">
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="scam-wrap">
    <h1>Share Sheet Master 📤</h1>
    <p class="muted">Tap the share icon, then pick the right action.</p>
    <div class="game-hud">
      <div class="game-stat"><div class="n" id="ss-score">0</div><div class="l">Correct</div></div>
      <div class="game-stat"><div class="n" id="ss-round">1 / 6</div><div class="l">Round</div></div>
    </div>
    <div class="game-card">
      <p class="mission-plain" id="ss-instr"></p>
      <div id="ss-content" style="background:#f7f9fd;border:2px solid var(--line);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px"></div>
      <div id="ss-sheet" style="display:none;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px"></div>
    </div>
    <div class="game-over" id="ss-over" style="display:none"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
<script src="update-log.js"></script>
<script src="feedback.js"></script>
  <script src="share-sheet.js"></script>
</body>
</html>
