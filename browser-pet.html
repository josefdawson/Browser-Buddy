<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Pet — Browser Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <style>
    .pet-wrap { max-width: 600px; margin: 0 auto; padding: 20px 24px 60px; text-align: center; }
    .pet-stage { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 30px; margin-bottom: 18px; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .pet-avatar { font-size: 6rem; transition: transform .3s; animation: pet-bob 2s ease-in-out infinite; }
    @keyframes pet-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .pet-avatar.sad { animation: none; filter: grayscale(0.5); }
    .pet-avatar.happy { animation: pet-bounce .5s ease; }
    @keyframes pet-bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .pet-name { font-size: 1.3rem; font-weight: 700; }
    .pet-status { color: var(--muted); font-size: .95rem; }
    .pet-bars { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
    .pet-bar { background: var(--line); border-radius: 99px; width: 120px; height: 12px; overflow: hidden; position: relative; }
    .pet-bar-fill { height: 100%; border-radius: 99px; transition: width .5s; }
    .pet-bar-fill.hunger { background: var(--bad); }
    .pet-bar-fill.happy { background: var(--good); }
    .pet-bar-fill.energy { background: var(--primary); }
    .pet-bar-label { font-size: .75rem; color: var(--muted); margin-bottom: 2px; }
    .pet-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    .pet-actions .btn { padding: 10px 18px; }
    .pet-msg { background: #f2f6ff; border-radius: 10px; padding: 10px 14px; font-size: .9rem; margin-top: 8px; min-height: 20px; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">🧭</span> Browser Buddy</a>
    <div class="topbar-right">
      <label class="jargon-toggle"><input type="checkbox" id="jargon-toggle"><span>Use everyday words</span></label>
      <span class="progress-chip" id="progress-chip">0 missions done</span>
    </div>
  </header>
  <main class="pet-wrap">
    <h1>Browser Pet 🐾</h1>
    <p class="muted">Adopt a desktop companion. Feed it by completing challenges!</p>

    <div class="pet-stage">
      <div class="pet-avatar" id="pet-avatar">🦆</div>
      <div class="pet-name" id="pet-name">Duckie</div>
      <div class="pet-status" id="pet-status">Happy and well-fed!</div>
      <div class="pet-bars">
        <div><div class="pet-bar-label">Hunger</div><div class="pet-bar"><div class="pet-bar-fill hunger" id="pet-hunger" style="width:80%"></div></div></div>
        <div><div class="pet-bar-label">Happiness</div><div class="pet-bar"><div class="pet-bar-fill happy" id="pet-happy" style="width:90%"></div></div></div>
        <div><div class="pet-bar-label">Energy</div><div class="pet-bar"><div class="pet-bar-fill energy" id="pet-energy" style="width:70%"></div></div></div>
      </div>
      <div class="pet-msg" id="pet-msg">Tap a button to interact!</div>
    </div>

    <div class="pet-actions">
      <button class="btn btn-primary" id="pet-feed">🍖 Feed</button>
      <button class="btn btn-ghost" id="pet-play">🎮 Play</button>
      <button class="btn btn-ghost" id="pet-rest">💤 Rest</button>
      <button class="btn btn-ghost" id="pet-rename">✏️ Rename</button>
    </div>

    <div class="game-card" style="margin-top:18px">
      <p class="mission-plain" id="pet-challenge">Complete a daily challenge to earn pet food!</p>
      <div class="game-actions">
        <button class="btn btn-primary btn-big" id="pet-challengebtn">Do a challenge</button>
      </div>
    </div>

    <div class="game-over" id="pet-over" style="display:none"></div>
  </main>
  <script src="app.js"></script>
<script src="hooks.js"></script>
<script src="content-drip.js"></script>
  <script src="sound.js"></script>
  <script src="browser-pet.js"></script>
</body>
</html>
